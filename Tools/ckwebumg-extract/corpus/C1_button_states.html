<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>C1_button_states</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; background: #0c0e12; font-family: Arial, sans-serif;
    display: flex; flex-direction: row; gap: 60px; padding: 80px;
    align-items: flex-start;
  }
  .btn {
    display: flex; justify-content: center; align-items: center;
    width: 280px; height: 64px;
    font-size: 18px; font-weight: 600;
    border: 2px solid rgb(90, 130, 200);
    border-radius: 8px;
    background-color: rgb(50, 90, 160);
    color: rgb(240, 244, 252);
  }
  .btn-interactive:hover {
    background-color: rgb(70, 115, 195);
    border-color: rgb(140, 180, 240);
    color: rgb(255, 255, 255);
  }
  .btn-interactive:active {
    background-color: rgb(30, 60, 120);
    border-color: rgb(60, 90, 150);
  }
  .btn-disabled:disabled {
    background-color: rgb(48, 52, 60);
    border-color: rgb(70, 76, 88);
    color: rgb(120, 126, 138);
  }
</style>
</head>
<body>
  <button class="btn btn-interactive" data-ck-name="InteractiveButton">HOVER AND PRESS</button>
  <button class="btn btn-disabled" disabled data-ck-name="DisabledButton">DISABLED</button>
  <button class="btn" data-ck-name="PlainButton">PLAIN</button>
</body>
</html>
