<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>P1_radius_borders</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; background: #0c0e12; font-family: Arial, sans-serif;
    display: flex; flex-direction: row; flex-wrap: wrap; gap: 40px; padding: 40px;
    align-content: flex-start;
  }
  .swatch { width: 320px; height: 220px; }

  .per-corner {
    background-color: rgb(190, 60, 60);
    border-top-left-radius: 4px;
    border-top-right-radius: 24px;
    border-bottom-right-radius: 48px;
    border-bottom-left-radius: 0px;
  }
  .pill {
    width: 420px; height: 120px;
    background-color: rgb(60, 150, 90);
    border-radius: 60px;
  }
  .circle {
    width: 220px; height: 220px;
    background-color: rgb(70, 110, 200);
    border-radius: 50%;
  }
  .per-side-border {
    background-color: rgb(30, 34, 42);
    border-top-width: 2px;
    border-right-width: 8px;
    border-bottom-width: 16px;
    border-left-width: 24px;
    border-style: solid;
    border-top-color: rgb(230, 90, 90);
    border-right-color: rgb(90, 230, 120);
    border-bottom-color: rgb(90, 140, 240);
    border-left-color: rgb(240, 200, 80);
  }
  .uniform-border {
    background-color: rgb(30, 34, 42);
    border: 6px solid rgb(200, 160, 50);
    border-radius: 12px;
  }
  .thick-radius {
    background-color: rgb(150, 80, 190);
    border: 12px solid rgb(240, 240, 250);
    border-radius: 40px 0 40px 0;
  }
</style>
</head>
<body>
  <div class="swatch per-corner" data-ck-name="PerCornerRadius"></div>
  <div class="pill" data-ck-name="PillFullyRounded"></div>
  <div class="circle" data-ck-name="CircleRadius50Pct"></div>
  <div class="swatch per-side-border" data-ck-name="PerSideBorderWidths"></div>
  <div class="swatch uniform-border" data-ck-name="UniformBorder"></div>
  <div class="swatch thick-radius" data-ck-name="ThickBorderMixedRadius"></div>
</body>
</html>
