<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>P3_shadows</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; background: #0c0e12; font-family: Arial, sans-serif;
    display: flex; flex-direction: row; gap: 80px; padding: 80px;
  }
  .card { width: 460px; height: 300px; }

  .shadow-single {
    background-color: rgb(190, 60, 60);
    box-shadow: 12px 16px 24px rgba(0, 0, 0, 0.75);
  }
  .shadow-multi {
    background-color: rgb(60, 150, 90);
    box-shadow:
      0 4px 8px rgba(0, 0, 0, 0.6),
      0 16px 32px rgba(70, 110, 200, 0.5),
      -8px -8px 16px rgba(200, 160, 50, 0.4);
  }
  .shadow-inset {
    background-color: rgb(70, 110, 200);
    box-shadow: inset 0 0 40px 10px rgba(0, 0, 0, 0.85);
  }
</style>
</head>
<body>
  <div class="card shadow-single" data-ck-name="OuterShadowSingle"></div>
  <div class="card shadow-multi" data-ck-name="OuterShadowMulti"></div>
  <div class="card shadow-inset" data-ck-name="InsetShadow"></div>
</body>
</html>
