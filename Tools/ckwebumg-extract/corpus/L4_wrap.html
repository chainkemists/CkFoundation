<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>L4_wrap</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; background: #0c0e12; font-family: Arial, sans-serif;
    display: flex; flex-direction: row; gap: 40px; padding: 40px;
  }
  .pad {
    display: flex; flex-direction: row;
    width: 700px; height: 900px;
    padding: 20px;
    background-color: rgb(20, 24, 30);
  }
  .wrap-fwd {
    flex-wrap: wrap;
    row-gap: 30px; column-gap: 10px;
    align-content: flex-start;
  }
  .wrap-rev {
    flex-wrap: wrap-reverse;
    row-gap: 10px; column-gap: 30px;
    align-content: space-between;
  }
  .tile { width: 150px; height: 80px; }
  .t0 { background-color: rgb(190, 60, 60); }
  .t1 { background-color: rgb(60, 150, 90); }
  .t2 { background-color: rgb(70, 110, 200); }
  .t3 { background-color: rgb(200, 160, 50); }
  .t4 { background-color: rgb(150, 80, 190); }
</style>
</head>
<body>
  <div class="pad wrap-fwd" data-ck-name="WrapForward">
    <div class="tile t0"></div><div class="tile t1"></div><div class="tile t2"></div>
    <div class="tile t3"></div><div class="tile t4"></div><div class="tile t0"></div>
    <div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div>
    <div class="tile t4"></div>
  </div>
  <div class="pad wrap-rev" data-ck-name="WrapReverse">
    <div class="tile t0"></div><div class="tile t1"></div><div class="tile t2"></div>
    <div class="tile t3"></div><div class="tile t4"></div><div class="tile t0"></div>
    <div class="tile t1"></div><div class="tile t2"></div><div class="tile t3"></div>
    <div class="tile t4"></div>
  </div>
</body>
</html>
